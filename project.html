<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encryptor</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-color: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #4caf50;
      --input-bg: #2a2a2a;
      --highlight-color: #76ff03;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: var(--card-color);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      width: 90%;
      max-width: 700px;
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 2.5rem;
      color: var(--highlight-color);
    }

    textarea, input[type="text"] {
      width: 100%;
      padding: 1rem;
      background: var(--input-bg);
      border: 1px solid #333;
      border-radius: 0.5rem;
      color: var(--text-color);
      margin-bottom: 1rem;
      resize: none;
      font-size: 1rem;
    }

    button {
      background-color: var(--accent-color);
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #45a047;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .history {
      margin-top: 2rem;
    }

    .history h2 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      color: var(--highlight-color);
    }

    .history ul {
      list-style: none;
      padding: 0;
      max-height: 200px;
      overflow-y: auto;
      background: var(--input-bg);
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
    }

    .history li {
      padding: 0.5rem 0;
      border-bottom: 1px solid #333;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Text Encryptor/Decryptor</h1>
    <textarea id="inputText" rows="5" placeholder="Enter your text..."></textarea>
    <div class="buttons">
      <button onclick="encryptText()">Encrypt</button>
      <button onclick="decryptText()">Decrypt</button>
    </div>
    <textarea id="outputText" rows="5" placeholder="Output will appear here..." readonly></textarea>

    <div class="history">
      <h2>Search History</h2>
      <ul id="historyList"></ul>
    </div>
  </div>

  <script>
    function encryptText() {
      const input = document.getElementById('inputText').value;
      const encrypted = btoa(unescape(encodeURIComponent(input)));
      document.getElementById('outputText').value = encrypted;
      updateHistory('Encrypted: ' + input);
    }

    function decryptText() {
      const input = document.getElementById('inputText').value;
      try {
        const decrypted = decodeURIComponent(escape(atob(input)));
        document.getElementById('outputText').value = decrypted;
        updateHistory('Decrypted: ' + input);
      } catch (e) {
        document.getElementById('outputText').value = 'Invalid encrypted text';
        updateHistory('Failed decryption attempt');
      }
    }

    function updateHistory(entry) {
      const list = document.getElementById('historyList');
      const item = document.createElement('li');
      item.textContent = entry;
      list.insertBefore(item, list.firstChild);
    }
  </script>
</body>
</html>
